# Read by /etc/init.d/S96v4l2rtspserver. Plain shell assignments.

# The capture node. UVC cameras enumerate as /dev/video0 when the SoC exposes
# no V4L2 device of its own, which is the case on every OpenIPC board.
V4L2_DEVICE=/dev/video0

# Capture format and mode asked of the camera. MJPG is passed through as-is;
# a camera that cannot do this mode falls back to what it can, see -vv.
V4L2_FORMAT=MJPG
V4L2_WIDTH=1280
V4L2_HEIGHT=720
V4L2_FPS=30

# Served as rtsp://<camera>:8554/usb. Port 554 belongs to the SoC streamer.
RTSP_PORT=8554
RTSP_PATH=usb

# Anything else, passed verbatim (e.g. "-U user:pass" for authentication).
V4L2RTSPSERVER_EXTRA=""
