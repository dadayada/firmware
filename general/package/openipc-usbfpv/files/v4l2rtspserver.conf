# Read by /etc/init.d/S96v4l2rtspserver. Plain shell assignments.
#
# This copy is the openipc-usbfpv profile's: the USB camera is a raw YUYV
# thermal core, so ffmpeg (S93usbtranscode) JPEG-encodes it into the
# v4l2loopback node below and that is what gets served. A camera that does
# MJPEG itself can be served directly: point V4L2_DEVICE at it, set the mode
# it offers, and disable S93usbtranscode.

V4L2_DEVICE=/dev/video10
V4L2_FORMAT=MJPG
V4L2_WIDTH=384
V4L2_HEIGHT=288
V4L2_FPS=25

# Served as rtsp://<camera>:8554/usb. Port 554 belongs to Divinus.
RTSP_PORT=8554
RTSP_PATH=usb

# Anything else, passed verbatim (e.g. "-U user:pass" for authentication).
V4L2RTSPSERVER_EXTRA=""
