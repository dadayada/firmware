# Read by /usr/sbin/usbtranscode (started by S93usbtranscode). Plain shell
# assignments.

# The USB camera as the kernel exposes it, and the mode to ask it for. These
# are what an InfiRay 384x288 thermal core reports; a different camera means
# different numbers, and `v4l2rtspserver -vv -f /dev/video0` prints them.
USB_SOURCE=/dev/video0
USB_WIDTH=384
USB_HEIGHT=288
USB_FPS=25

# Which program turns the raw frames into MJPEG.
#   usbmjpeg  libjpeg-turbo with NEON; a few percent of a core. Default.
#   ffmpeg    the fallback; no NEON DCT, took a whole core at 384x288/25.
USB_ENCODER=usbmjpeg

# The core the encoder is pinned to and how far it yields to the rest. The
# sensor pipeline's threads live on core 0, and an encoder sharing it cost
# the main stream frames; core 1 is otherwise idle. Empty = let the
# scheduler choose. usbmjpeg pins itself; ffmpeg only if taskset exists.
USB_ENCODER_CPU=1
USB_ENCODER_NICE=5

# JPEG quality. libjpeg's 1-100 scale for usbmjpeg (80 is ~25KB a frame at
# 384x288, about 5Mbit/s at 25fps); ffmpeg's -q:v 2-31 scale for ffmpeg.
USB_JPEG_QUALITY=80
USB_FFMPEG_QSCALE=5

# The v4l2loopback node the encoder writes to. Must match the video_nr in
# /etc/modules and V4L2_DEVICE in /etc/v4l2rtspserver.conf.
USB_SINK=/dev/video10

# Anything else, appended to the encoder's command line.
USBTRANSCODE_EXTRA=""
