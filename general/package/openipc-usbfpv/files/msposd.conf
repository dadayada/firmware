# Read by /etc/init.d/S99msposd. Plain shell assignments.

# Flight controller UART. UART2 is the FC port on SSC338Q FPV boards; UART0 is
# the console and must not be used here.
MSPOSD_UART=/dev/ttyS2
MSPOSD_BAUD=115200

# Where the aggregated MSP DisplayPort stream goes. The OSD is drawn there,
# not on the camera: msposd on x86 or PixelPilot listens on this port and
# overlays whichever RTSP stream it is showing. With WireGuard up, the
# ground station is the peer at the far end of wg0; the address below is the
# stock wg0 subnet's first peer and will need to match your peer.
MSPOSD_OUT=192.168.99.2:14550

# Anything else, passed verbatim (e.g. "-c 7" to run channels.sh on RC 7).
MSPOSD_EXTRA=""
